<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>moruko 紹介スライド</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: 'Noto Sans JP', sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .slide-container { position: relative; width: 100vw; max-width: 1280px; }
  .slide-wrapper { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .slide { display: none; width: 100%; height: 100%; }
  .slide.active { display: block; }
  .slide img { width: 100%; height: 100%; object-fit: cover; }
  .controls { display: flex; align-items: center; gap: 24px; margin-top: 20px; }
  .btn { background: rgba(255,138,0,0.15); border: 1.5px solid #FF8A00; color: #FF8A00; padding: 10px 28px; border-radius: 6px; font-size: 18px; cursor: pointer; transition: all 0.2s; user-select: none; }
  .btn:hover { background: #FF8A00; color: #000; }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .counter { font-size: 14px; color: #999; min-width: 60px; text-align: center; }
  .thumbnails { display: flex; gap: 6px; margin-top: 14px; overflow-x: auto; max-width: 100vw; padding: 4px 16px; scrollbar-width: thin; scrollbar-color: #FF8A00 #222; }
  .thumb { flex-shrink: 0; width: 80px; aspect-ratio: 16/9; border-radius: 3px; overflow: hidden; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; opacity: 0.5; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.active { border-color: #FF8A00; opacity: 1; }
  .thumb:hover { opacity: 0.85; }
  .hint { font-size: 11px; color: #555; margin-top: 10px; }
</style>
</head>
<body>
<div class="slide-container">
  <div class="slide-wrapper" id="slideWrapper"></div>
  <div class="controls">
    <button class="btn" id="prevBtn">←</button>
    <span class="counter" id="counter">1 / 13</span>
    <button class="btn" id="nextBtn">→</button>
  </div>
  <div class="thumbnails" id="thumbnails"></div>
  <p class="hint">キーボード ← → でも操作できます</p>
</div>

<script>
const SLIDES = [
  ['slide_01_title.png', 'タイトル'],
  ['slide_02_assets_game.png', '資産ゲー'],
  ['slide_03_team_obsolete.png', 'チーム化→陳腐化'],
  ['slide_04_what_is_moruko.png', 'morukoとは'],
  ['slide_05_how_to_use.png', '操作方法'],
  ['slide_06_features.png', 'できること'],
  ['slide_07_use_cases.png', 'ユースケース'],
  ['slide_08_safety.png', '安心設計'],
  ['slide_09_asset.png', '資産になる'],
  ['slide_10_testimonials.png', '利用者の声'],
  ['slide_11_support.png', 'サポート'],
  ['slide_12_pricing.png', '料金'],
  ['slide_13_faq.png', 'FAQ'],
];

let current = 0;
const wrapper = document.getElementById('slideWrapper');
const thumbContainer = document.getElementById('thumbnails');
const counter = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

SLIDES.forEach(([src, label], i) => {
  const div = document.createElement('div');
  div.className = 'slide' + (i === 0 ? ' active' : '');
  const img = document.createElement('img');
  img.src = src;
  img.alt = label;
  div.appendChild(img);
  wrapper.appendChild(div);

  const t = document.createElement('div');
  t.className = 'thumb' + (i === 0 ? ' active' : '');
  t.setAttribute('data-index', i);
  const tImg = document.createElement('img');
  tImg.src = src;
  tImg.alt = label;
  t.appendChild(tImg);
  t.addEventListener('click', () => goTo(i));
  thumbContainer.appendChild(t);
});

function goTo(n) {
  const allSlides = wrapper.querySelectorAll('.slide');
  const allThumbs = thumbContainer.querySelectorAll('.thumb');
  allSlides[current].classList.remove('active');
  allThumbs[current].classList.remove('active');
  current = Math.max(0, Math.min(SLIDES.length - 1, n));
  allSlides[current].classList.add('active');
  allThumbs[current].classList.add('active');
  allThumbs[current].scrollIntoView({ inline: 'nearest', behavior: 'smooth' });
  counter.textContent = (current + 1) + ' / ' + SLIDES.length;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === SLIDES.length - 1;
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

goTo(0);
</script>
</body>
</html>
